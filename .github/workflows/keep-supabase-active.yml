name: Keep Supabase active

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run a harmless database query
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: psql "$DIRECT_URL" --set=ON_ERROR_STOP=1 --command="SELECT 1;"
